[project]
name = "crankcam"
version = "0.1.0"
description = "Python client for the RP2040 crank/cam trigger testbench USB-serial menu"
requires-python = ">=3.8"
dependencies = ["pyserial>=3.5"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crankcam"]
